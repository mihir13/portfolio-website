# Decap CMS: edit the site at https://mihirthakker.com/admin
# Saves go to GitHub as commits; Netlify then rebuilds the site automatically.
backend:
  name: github
  repo: mihir13/portfolio-website
  branch: master
  # Requires a GitHub OAuth app configured in Netlify (see README).

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Profile & contact
        file: content/site.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: headline, label: Headline, widget: string }
          - { name: roles, label: Rotating words in hero, widget: list, field: { name: role, label: Role, widget: string } }
          - { name: location, label: Location, widget: string }
          - { name: status, label: Status line, widget: string }
          - { name: intro, label: Hero intro, widget: text }
          - { name: about, label: About text, widget: text }
          - { name: photo, label: Photo, widget: image, required: false }
          - { name: now, label: Right now lines (terminal card), widget: list, required: false, field: { name: line, label: Line, widget: string } }
          - name: stats
            label: Headline numbers
            widget: list
            required: false
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - { name: cv, label: CV (PDF), widget: file, required: false }
          - { name: email, label: Email, widget: string }
          - { name: turnstileSiteKey, label: Cloudflare Turnstile site key (public; leave empty to switch the spam check off), widget: string, required: false }
          - { name: contact_blurb, label: Contact blurb, widget: text }
          - name: socials
            label: Social links
            widget: object
            fields:
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
              - { name: github, label: GitHub, widget: string, required: false }
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: twitter, label: X / Twitter, widget: string, required: false }
              - { name: youtube, label: YouTube, widget: string, required: false }
      - name: experience
        label: Experience
        file: content/experience.json
        fields:
          - name: items
            label: Roles (newest first)
            widget: list
            fields:
              - { name: title, label: Job title, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: summary, label: Summary (1-2 sentences), widget: text }
              - { name: highlights, label: Highlights, widget: list, required: false, field: { name: highlight, label: Highlight, widget: text } }
      - name: certifications
        label: Certifications & education
        file: content/certifications.json
        fields:
          - name: items
            label: Certifications
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: detail, label: Year or status, widget: string }
          - name: education
            label: Education
            widget: object
            fields:
              - { name: degree, label: Degree, widget: string }
              - { name: school, label: School, widget: string }
              - { name: detail, label: Detail, widget: string }
      - name: skills
        label: Skills
        file: content/skills.json
        fields:
          - name: groups
            label: Skill groups
            widget: list
            fields:
              - { name: name, label: Group name, widget: string }
              - { name: skills, label: Skills, widget: list, field: { name: skill, label: Skill, widget: string } }

  - name: case_studies
    label: Case studies
    folder: content/case-studies
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: category, label: Category, widget: string }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: order, label: Order (1 = first), widget: number, value_type: int, default: 50 }
      - { name: problem, label: Problem, widget: text }
      - { name: approach, label: Approach, widget: text }
      - { name: result, label: Result, widget: text }
      - { name: lesson, label: Lesson, widget: text }

  - name: projects
    label: Projects
    folder: content/projects
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: image, label: Screenshot, widget: image, required: false }
      - { name: link, label: Link, widget: string }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: order, label: Order (1 = first), widget: number, value_type: int, default: 50 }

  - name: notes
    label: Notes
    folder: content/notes
    extension: json
    format: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: summary, label: Summary, widget: text }
      - { name: link, label: Link (optional), widget: string, required: false }
      - { name: body, label: Full text (optional, blank line between paragraphs), widget: text, required: false }
